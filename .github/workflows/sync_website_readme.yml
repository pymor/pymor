---
# Keeps the content of https://pymor.org (README.md on the gh-pages branch)
# in sync with README.md on main.
name: Sync website README
on:
  push:
    branches:
      - main
    paths:
      - README.md
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-website-readme
jobs:
  sync:
    name: Copy README.md to gh-pages
    # do not run in forks
    if: github.repository == 'pymor/pymor'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
      - name: Update README.md
        # - drop the logo, which is already part of the website layout
        # - turn relative links (e.g. LICENSE.txt) into links to the repository
        run: |
          sed -E \
            -e '/^!\[pyMOR Logo\]\(/d' \
            -e 's#\]\((\./)?([^):/\#][^):]*)\)#](https://github.com/pymor/pymor/blob/main/\2)#g' \
            main/README.md > gh-pages/README.md
      - name: Commit and push
        working-directory: gh-pages
        run: |-
          if git diff --quiet; then
            echo "gh-pages README.md is already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "update README.md from main (${GITHUB_SHA::9})"
          git push origin gh-pages
